<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>

    <style>
        body{
            margin:0;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            font-family:Arial, sans-serif;
            background:#f2f2f2;
        }

        #container{
            text-align:center;
            padding:25px;
            border:1px solid #ccc;
            border-radius:10px;
            background:white;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        #count{
            font-size:40px;
            font-weight:bold;
            margin:0 20px;
        }

        button{
            padding:10px 18px;
            font-size:20px;
            cursor:pointer;
            border:none;
            border-radius:5px;
            background:#007bff;
            color:white;
        }

        button:hover{
            background:#0056b3;
        }

        #reset{
            margin-top:20px;
            width:100%;
        }
    </style>
</head>
<body>

<div id="container">

    <button onclick="decrease()">-</button>

    <span id="count">0</span>

    <button onclick="increase()">+</button>

    <br><br>

    <button id="reset" onclick="resetCounter()">Reset</button>

</div>

<script>

let count = 0;

function increase() {
    count++;
    document.getElementById("count").innerHTML = count;
}

function decrease() {
    if(count > 0){
        count--;
    }
    document.getElementById("count").innerHTML = count;
}

function resetCounter() {
    count = 0;
    document.getElementById("count").innerHTML = count;
}

</script>

</body>
</html>

name: Deploy Web Interface to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          cp index.html site/index.html

          build_vite_project() {
            local project_dir="$1"
            local site_path="$2"
            local base_path="/WEB-INTERFACE/${site_path}/"

            npm --prefix "$project_dir" ci
            npm --prefix "$project_dir" run build -- --base "$base_path"
            mkdir -p "site/$site_path"
            cp -R "$project_dir/dist/." "site/$site_path/"
            cp "site/$site_path/index.html" "site/$site_path/404.html"
          }

          build_vite_project "attendance/attendance" "attendance"
          build_vite_project "calculator/calculator" "calculator"
          build_vite_project "formvalidation/formvalidation" "formvalidation"
          build_vite_project "hobbies-card/hobbiescard" "hobbies-card"
          build_vite_project "personal introduction/Personal-introduction" "personal-introduction"
          build_vite_project "reactportfolio/reactportfolio" "reactportfolio"
          build_vite_project "report" "report"
          build_vite_project "to-do-app/to-do" "to-do-app"

          mkdir -p site/counter site/studentcard
          cp counter.html site/counter/index.html
          cp studentcard.html site/studentcard/index.html
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Profile Card</title>

<style>
body{
    margin:0;
    padding:0;
    background:#f0f4f8;
    font-family:Arial, Helvetica, sans-serif;
}

.container{
    width:400px;
    margin:40px auto;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 0 15px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    color:#1e3a8a;
}

label{
    font-weight:bold;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    border:1px solid gray;
    border-radius:6px;
    font-size:16px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:18px;
}

button:hover{
    background:#1d4ed8;
}

.card{
    width:400px;
    margin:40px auto;
    background:#e0f2fe;
    padding:25px;
    border-radius:12px;
    box-shadow:0 0 15px rgba(0,0,0,0.2);
    display:none;
}

.card h2{
    text-align:center;
    color:#0f172a;
}

.card p{
    font-size:18px;
    margin:12px 0;
}

.backBtn{
    margin-top:20px;
    background:#16a34a;
}

.backBtn:hover{
    background:#15803d;
}
</style>

</head>
<body>

<div class="container" id="formContainer">

<h1>Student Profile Form</h1>

<form id="studentForm">

<label>Name</label>
<input type="text" id="name" placeholder="Enter Your Name">

<label>Roll Number</label>
<input type="number" id="rn" placeholder="Enter Roll Number">

<label>Mark</label>
<input type="number" id="mark" placeholder="Enter Mark">

<button type="submit">Display Profile</button>

</form>

</div>

<div class="card" id="profileCard">

<h2>Student Details</h2>

<p><b>Name :</b> <span id="showName"></span></p>

<p><b>Roll Number :</b> <span id="showRoll"></span></p>

<p><b>Mark :</b> <span id="showMark"></span></p>

<p><b>Grade :</b> <span id="showGrade"></span></p>

<button class="backBtn" onclick="goBack()">Back</button>

</div>

<script>

document.getElementById("studentForm").addEventListener("submit",function(event){

event.preventDefault();

let name=document.getElementById("name").value.trim();
let roll=document.getElementById("rn").value;
let mark=document.getElementById("mark").value;

if(name==""){
alert("Enter Name");
return;
}

if(roll==""){
alert("Enter Roll Number");
return;
}

if(mark==""){
alert("Enter Mark");
return;
}

mark=Number(mark);

if(mark<0 || mark>100){
alert("Mark should be between 0 and 100");
return;
}

let grade="";

if(mark>=90)
grade="A+";
else if(mark>=80)
grade="A";
else if(mark>=70)
grade="B";
else if(mark>=60)
grade="C";
else if(mark>=50)
grade="D";
else
grade="Fail";

document.getElementById("showName").innerHTML=name;
document.getElementById("showRoll").innerHTML=roll;
document.getElementById("showMark").innerHTML=mark;
document.getElementById("showGrade").innerHTML=grade;

document.getElementById("formContainer").style.display="none";
document.getElementById("profileCard").style.display="block";

});

function goBack(){

document.getElementById("profileCard").style.display="none";
document.getElementById("formContainer").style.display="block";
document.getElementById("studentForm").reset();

}

</script>

</body>
</html>
